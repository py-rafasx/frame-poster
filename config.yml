# ======================================================================================================================
# GitHub Repository Configuration
# ======================================================================================================================
# Frames are downloaded from GitHub Raw. For each episode, set ``github_repo``
# to the full path up to the folder that contains the episode folders.
#
# Expected format for ``github_repo``:
#   "username/repository/branch/"
#
# Example:
#   github_repo: "py-rafasx/season2/master/"
#
# The final URL is built like this:
#   https://raw.githubusercontent.com/{github_repo}{episode}/{frame}.jpg
#
# Concrete example:
#   github_repo = "py-rafasx/season2/master/"
#   episode     = 1   (folder "01")
#   frame       = 5   (file "0005.jpg")
#   → https://raw.githubusercontent.com/py-rafasx/season2/master/01/0005.jpg
#
# Expected repository structure:
#   username/
#     repository/
#       branch/
#         01/
#           0001.jpg
#           0002.jpg
#           ...
#         02/
#           0001.jpg
#           ...

# ======================================================================================================================
# Seasons Configuration
# ======================================================================================================================
# List of seasons with their episodes and metadata 
seasons:                                                # type: list of objects 
  - season: 1                                           # type: integer | string - Season number
    episodes:                                           # type: list of objects - Episodes in this season
      - episode: 1                                      # type: number | string - Episode name (used for folder path in GitHub) (need matching folder name in GitHub repo) (epiosode name can be a number or a string)
        title: "Episode 01"                             # type: string - Episode title (used in post messages) (optional)
        img_fps: 3.5                                    # type: integer | float - Frames per second of the source video (needed for proper timing subtitles)
        max_frames: 5040                                # type: integer - Maximum number of frames obtained from the video after cutted
        album_id: 703927706019990                       # type: integer - Facebook album ID for reposting frames in Facebook (optional)
        github_repo: "py-rafasx/season2/master/01/"     # type: string - Github repository path for this episode (required)

    # add more episodes here

# ======================================================================================================================
# Progress Tracking
# ======================================================================================================================
# Stores the current posting progress to resume from the last posted frame
progress:                                             # type: object
  season: 1                                           # type: integer | string - Current season number
  episode: 1                                          # type: integer | string - Current episode number/index
  frame: 1163                                         # type: integer - Current frame number (0 = not started, starts from 1)

# ======================================================================================================================
# Message Templates
# ======================================================================================================================
# Placeholders supported in templates:
#   {season}          - The season number
#   {episode}         - The episode number
#   {frame_number}    - The current frame number
#   {max_frames}      - The maximum frames in the episode
#   {img_fps}         - The frames per second of the image/video
#   {fph}             - The frames per hour posting rate
#   {timestamp}       - The timestamp of the frame
#   {subtitles}       - The subtitles of the frame
#   {episode_title}   - The title of the episode
#   {post_interval}   - The interval between posts in minutes
#   {execution_interval} - The interval between script executions in hours
#
#   Extra placeholders for random post templates (random_post: true):
#   {filter_func}                - Name of the filter applied to the frame
#     (TEMPLATE_RANDOM_FRAME_MSG and TEMPLATE_RANDOM_TWO_PANELS_MSG)
#   {episode1} / {episode2}      - Episodes of each panel
#   {frame1} / {frame2}          - Frame numbers of each panel
#     (TEMPLATE_RANDOM_TWO_PANELS_MSG only)
#   {timestamp1} / {timestamp2}  - Timestamps of each panel
#
#   {new_line}        - Alias for newline
#   {linebreak}       - Alias for newline
#   {br}              - Alias for newline




TEMPLATE_POST_MSG: |                                  # type: string - Template for regular frame posts
  Season {season}, Episode {episode}, Frame {frame_number} out of {max_frames}
  timestamp: {timestamp}

TEMPLATE_BIO_MSG: |                                   # type: string - Template for bio/description (101 caracters max)
  Posting {fph} frames every {execution_interval} hours

TEMPLATE_RANDOM_FRAME_MSG: |                          # type: string - Template for random single-frame posts
  [Random] Frame

  Season: {season}, Episode: {episode}, Frame: {frame_number}
  Timestamp: {timestamp}
  Filter: {filter_func}

TEMPLATE_RANDOM_TWO_PANELS_MSG: |                     # type: string - Template for two_panels posts (two stacked frames)
  [Random] Frames

  Season: {season}
  Episodes: [{episode1}, {episode2}]
  Frames: [{frame1}, {frame2}]
  Timestamps: [{timestamp1}, {timestamp2}]
  Filter: {filter_func}

# ======================================================================================================================
# Posting Configuration
# ======================================================================================================================
posting:                                              # type: object
  fph: 15                                             # type: integer - Frames posted per hour (for execution interval calculation)
  post_interval: 2                                    # type: integer - Interval between posts in minutes (recommended: 2+)
  sub_comment: true                                   # type: boolean - Post subtitles in comments if available (you can use subtitle in TEMPLATE_POST_MSG even if sub_comment is false)
  album_repost: true                                  # type: boolean - Repost frames to Facebook album (sequential mode only, ignored by random_post)
  random_post: false                                  # type: boolean - Post random frames insted sequencial

# ======================================================================================================================
# Random Crop Configuration
# ======================================================================================================================
# Settings for random image cropping (optional feature)
random_crop:                                          # type: object
  enabled: true                                       # type: boolean - Enable random cropping for comments
  min_size: 200                                       # type: integer - Minimum square crop size in pixels (default: 200)
  max_size: 600                                       # type: integer - Maximum square crop size in pixels (default: 600)

# ======================================================================================================================
# Filters Configuration (used when random_post is true)
# ======================================================================================================================
# Filters are applied to the frame before posting to Facebook.
# Each enabled filter has a weight ("percent"); one filter is chosen
# randomly per post proportionally to its weight.
# Available filters: none_filter, two_panels, mirror, negative, brightness_contrast, palette_filter, warp_in, warp_out
filters:                                              # type: object
  none_filter:                                        # No filter applied (posts the original frame)
    enabled: true                                     # type: boolean - Enable this filter
    percent: 0.8                                      # type: integer | float - Selection weight

  two_panels:
    enabled: true                                    # Stacks two random frames vertically into a single image
    percent: 0.4

  mirror:
    enabled: true                                    # Mirrors half of the frame randomly (left or right)
    percent: 0.5

  negative:
    enabled: true                                    # Inverts the frame colors
    percent: 0.2

  brightness_contrast:
    enabled: false                                    # Darkens and increases contrast of the frame
    percent: 0.5

  palette_filter:
    enabled: false                                    # Builds a labeled color palette strip below the frame (6-10 colors)
    percent: 0.3

  warp_in:
    enabled: false                                    # Applies an implode filter (warp pixels inward)
    percent: 0.3

  warp_out:
    enabled: false                                    # Applies an explode filter (warp pixels outward)
    percent: 0.3

# ======================================================================================================================
# API and System Configuration
# ======================================================================================================================
facebook_api_version: "v25.0"                         # type: string - Facebook Graph API version (default: v25.0)
timezone: -3                                          # type: integer - Timezone offset in hours (default: UTC-0)
# ======================================================================================================================
