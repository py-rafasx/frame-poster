[project]
name = "frame-poster"
version = "0.1.0"
description = "Facebook frame poster application"
requires-python = "==3.13"
dependencies = [
    "ruamel.yaml==0.18.15",
    "python-dotenv==1.1.1",
    "langdetect==1.0.9",
    "tenacity==9.1.2",
    "httpx==0.28.1",
    "Pillow==11.3.0",
    "croniter==6.2.3",
    "PyYAML==6.0.3",
    "rich==14.1.0",
    "tzdata==2026.2",
    "pyfiglet==1.0.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "mypy==2.3.1",
]

[tool.mypy]
python_version = "3.13"
files = ["main.py", "src", "tests"]
mypy_path = "."
explicit_package_bases = true
namespace_packages = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = false
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["yaml", "croniter", "langdetect"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "C4", "SIM", "B", "A"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Ignora imports não usados em __init__.py

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
